name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
  TF_WORKING_DIR: terraform

  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_URL: ${{ vars.CORTEX_API_URL }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraform

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cortex-eks-security-lab/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download Cortex CLI
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "${CORTEX_API_URL}" ] || \
             [ -z "${CORTEX_API_KEY}" ] || \
             [ -z "${CORTEX_API_KEY_ID}" ]; then
            echo "Cortex credentials not configured - skipping download"
            exit 1
          fi

          crtx_resp=$(curl -sS \
            "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")

          crtx_url=$(echo "${crtx_resp}" | jq -r '.signed_url')

          test -n "${crtx_url}"
          test "${crtx_url}" != "null"

          curl -sSLo cortexcli "${crtx_url}"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Cortex Cloud Code Scan
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -x "./cortexcli" ]; then
            echo "Cortex CLI unavailable - skipping scan"
            exit 1
          fi

          ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            code scan \
            --directory "${{ github.workspace }}" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --source "GITHUB_ACTIONS" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_org_id=${{ vars.LAB_GITHUB_ORG_ID }}" \
            -var="github_repo_id=${{ vars.LAB_GITHUB_REPO_ID }}" \
            -var="eks_admin_principal_arn=${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}" \
            -var="terraform_role_arn=${{ vars.AWS_TERRAFORM_ROLE_ARN }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
