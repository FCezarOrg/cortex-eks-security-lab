apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: cortex-security-lab
type: Opaque

# SECURITY LAB ONLY
# Synthetic credentials intentionally stored in source control.
stringData:
  MONGO_INITDB_ROOT_USERNAME: demo_admin
  MONGO_INITDB_ROOT_PASSWORD: DemoMongoPassword123!

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: cortex-security-lab
spec:
  storageClassName: gp3

  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: cortex-security-lab
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb

          # Intentionally outdated for vulnerability demonstration.
          image: mongo:6.0

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: cortex-security-lab
spec:
  type: ClusterIP

  selector:
    app: mongodb

  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
